name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget xz-utils make gcc binutils bison flex \
            libelf-dev libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev python3

      - name: 🛠️ Baixar PS3 Toolchain (bucanero)
        run: |
          wget -q https://github.com/bucanero/ps3toolchain/releases/download/20220523/ps3dev-ubuntu20.04.tar.xz
          mkdir -p ~/ps3dev
          tar xf ps3dev-ubuntu20.04.tar.xz -C ~/ps3dev
          echo "PS3DEV=$HOME/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$HOME/ps3dev" >> $GITHUB_ENV
          echo "$HOME/ps3dev/bin:$HOME/ps3dev/ppu/bin:$HOME/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: ✅ Verificar
        run: ppu-gcc --version

      - name: 🏗️ Compilar
        run: make clean && make
