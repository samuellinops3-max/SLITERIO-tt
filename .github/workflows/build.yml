name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget xz-utils make gcc flex bison \
            libelf-dev libgmp3-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: 🛠️ Baixar e instalar PS3 Toolchain
        run: |
          wget -q https://github.com/ps3dev/ps3dev-docker/releases/download/toolchain-20220523/ps3dev.tar.xz
          mkdir -p ~/ps3dev
          tar xf ps3dev.tar.xz -C ~/ps3dev
          echo "PS3DEV=$HOME/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$HOME/ps3dev" >> $GITHUB_ENV
          echo "$HOME/ps3dev/bin:$HOME/ps3dev/ppu/bin:$HOME/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: ✅ Verificar instalação
        run: ppu-gcc --version

      - name: 🏗️ Compilar
        run: make clean && make
