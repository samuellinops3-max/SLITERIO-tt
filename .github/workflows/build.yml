name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: ppu-gcc --version

      - name: Compilar
        run: make clean && make
