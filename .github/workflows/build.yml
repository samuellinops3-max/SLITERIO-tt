name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps3dev/ps3dev:latest

    steps:
      - name: 📥 Pegar código
        uses: actions/checkout@v4

      - name: ✅ Verificar compilador
        run: ppu-gcc --version

      - name: 🏗️ Compilar jogo
        run: make clean && make
